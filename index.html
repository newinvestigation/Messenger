<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>초자연재난관리국 신규조사반 통신망</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --gov-blue:#1B4A9C; --gov-blue-dark:#153B7C; --gov-blue-tint:#EAF0FA;
    --gov-red:#C23B3B; --gov-red-tint:#FBEAEA;
    --line:#E4E7EC; --line-soft:#EEF0F3; --line-strong:#C7CDD6;
    --ink:#22262E; --ink-soft:#7A8290; --ink-faint:#9AA3B0;
    --bg:#F1F3F6; --panel:#FFFFFF;
    --green:#2E8B57; --green-tint:#E5F3EA;
    --shadow: rgba(20,30,50,0.10); --shadow-lg: rgba(20,30,50,0.16);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:'Pretendard', sans-serif; color:var(--ink); background:var(--bg);
    overflow:hidden;
  }
  .shell{ height:100vh; height:100dvh; display:flex; flex-direction:column; max-width:1400px; margin:0 auto; background:var(--panel); box-shadow:0 0 60px var(--shadow-lg); }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-shrink:0;
    padding:12px 22px; background:#fff;
    color:var(--ink); border-bottom:3px solid var(--gov-blue);
  }
  .brand{ display:flex; align-items:center; gap:11px; min-width:0; }
  .seal{ width:36px; height:36px; flex-shrink:0; object-fit:contain; }
  .brand-text h1{ font-family:'Pretendard', sans-serif; font-weight:800; font-size:16.5px; margin:0; color:#1B2A4A; letter-spacing:0.1px; }
  .tagline{ margin:2px 0 0; font-size:9.5px; color:var(--ink-faint); font-family:'IBM Plex Mono', monospace; letter-spacing:1px; }

  .status-cluster{ text-align:right; flex-shrink:0; }
  .status-agent{ font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; color:var(--gov-blue); }
  .status-line{ display:flex; align-items:center; justify-content:flex-end; gap:6px; font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--green); font-weight:600; letter-spacing:0.4px; margin-top:2px; }
  .status-dot{ width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 rgba(46,139,87,0.5); animation:pulse 2s infinite; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(46,139,87,0.5);} 70%{ box-shadow:0 0 0 6px rgba(46,139,87,0);} 100%{ box-shadow:0 0 0 0 rgba(46,139,87,0);} }
  @media (prefers-reduced-motion: reduce){ .status-dot{ animation:none; } }

  .notice-bar{
    background:var(--gov-blue-tint); color:var(--gov-blue-dark); flex-shrink:0;
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:10.5px; padding:7px 22px; letter-spacing:0.2px;
    border-bottom:1px solid #D7E2F3; display:flex; align-items:center; gap:8px;
  }
  .notice-bar::before{ content:'공지'; background:var(--gov-blue); color:#fff; font-size:9.5px; padding:2px 7px; border-radius:2px; letter-spacing:0.5px; flex-shrink:0; }

  /* ---------- Workspace: rail + list + detail ---------- */
  .workspace{ flex:1; min-height:0; display:flex; }

  .rail{
    width:70px; flex-shrink:0; background:#fff; border-right:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; padding:14px 0; gap:6px;
  }
  .rail-btn{
    position:relative; width:42px; height:42px; border-radius:6px; border:none; background:none; color:var(--ink-faint);
    display:flex; align-items:center; justify-content:center; cursor:pointer; background-size:cover; background-position:center;
  }
  .rail-btn svg{ width:20px; height:20px; }
  .rail-btn:hover{ background-color:var(--gov-blue-tint); color:var(--gov-blue); }
  .rail-btn.active{ background-color:var(--gov-blue-tint); color:var(--gov-blue); box-shadow:inset 3px 0 0 var(--gov-blue); }
  .rail-btn:focus-visible{ outline:2px solid var(--gov-blue); outline-offset:1px; }
  .rail-spacer{ flex:1; }
  .rail-admin{ color:var(--ink-faint); }
  .rail-admin.on{ background-color:var(--gov-red); color:#fff; }
  .rail-btn#notifToggleBtn.on{ color:var(--gov-blue); background-color:var(--gov-blue-tint); }
  .rail-avatar{ background-color:var(--gov-blue); color:#fff; font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:12px; border-radius:50%; }
  .rail-avatar:hover{ background-color:var(--gov-blue-dark); color:#fff; }
  .back-btn{ display:none; background:none; border:none; color:var(--ink-soft); font-size:22px; line-height:1; cursor:pointer; padding:4px 8px 4px 0; }

  /* ---------- List panel ---------- */
  .list-panel{ width:320px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .list-header{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:16px 18px 10px; flex-shrink:0; border-bottom:2px solid var(--gov-blue); }
  .list-header h2{ display:flex; align-items:center; gap:5px; font-size:13.5px; font-weight:800; margin:0; color:#1B2A4A; letter-spacing:0.2px; }
  .hdr-mark-icon{ display:inline-flex; color:var(--gov-blue); flex-shrink:0; }
  .hdr-mark-icon svg{ width:14px; height:14px; }
  .list-search{ padding:12px 16px 8px; flex-shrink:0; }
  .list-search input{
    width:100%; border:1px solid var(--line-strong); background:#F9FAFC; border-radius:3px; padding:8px 11px;
    font-size:12.5px; font-family:'Pretendard', sans-serif; color:var(--ink);
  }
  .list-search input:focus-visible{ outline:2px solid var(--gov-blue); }
  .list-body{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; min-height:0; padding:2px 0 12px; }
  .list-stats{ padding:10px 16px 2px; font-size:10.5px; color:var(--ink-faint); font-family:'IBM Plex Mono', monospace; text-align:center; }

  .list-row{
    display:flex; gap:10px; align-items:flex-start; padding:12px 18px; cursor:pointer;
    border-bottom:1px solid var(--line-soft);
  }
  .list-row:hover{ background:#F9FAFC; }
  .list-row.active{ background:var(--gov-blue-tint); box-shadow:inset 3px 0 0 var(--gov-blue); }
  .row-avatar{
    width:34px; height:34px; border-radius:50%; background:var(--gov-blue); color:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; font-family:'IBM Plex Mono', monospace;
    background-size:cover; background-position:center;
  }
  .row-avatar.chat{ background-color:var(--gov-blue-tint); color:var(--gov-blue); }
  .row-avatar.chat svg{ width:16px; height:16px; }
  .row-avatar.closed{ filter:grayscale(0.5); opacity:0.7; }
  .row-main{ flex:1; min-width:0; }
  .row-top{ display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .row-title{ font-weight:700; font-size:13px; color:#1B2A4A; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-time{ font-size:9.5px; color:var(--ink-faint); font-family:'IBM Plex Mono', monospace; flex-shrink:0; }
  .row-snippet{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-tags{ display:flex; gap:6px; margin-top:6px; align-items:center; }
  .tag{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; font-weight:700; letter-spacing:0.2px;
    padding:2px 7px; border-radius:2px; background:var(--green-tint); color:var(--green);
  }
  .tag.closed{ background:var(--gov-red-tint); color:var(--gov-red); }
  .tag-case{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:var(--gov-blue); font-weight:700; }

  /* ---------- Detail panel ---------- */
  .detail-panel{ flex:1; min-width:0; display:flex; flex-direction:column; background:var(--panel); min-height:0; }
  .detail-header{ display:flex; align-items:center; gap:10px; padding:18px 24px; border-bottom:2px solid var(--gov-blue); background:#fff; flex-shrink:0; }
  .detail-header-main{ flex:1; min-width:0; }
  .detail-header h3{ margin:0; font-size:16px; font-weight:800; color:#1B2A4A; }
  .detail-case{ margin:0 0 2px; font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--gov-blue); font-weight:700; letter-spacing:0.4px; }
  .detail-sub{ margin:4px 0 0; font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace; }
  .detail-scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:22px 24px; min-height:0; }
  .detail-desc{ font-size:13.5px; line-height:1.7; margin:0 0 16px; white-space:pre-wrap; word-break:break-word; max-width:640px; color:#28303D; }
  .detail-actions{ display:flex; gap:8px; margin-bottom:16px; }
  .detail-divider{ font-family:'Pretendard', sans-serif; font-size:13px; font-weight:800; color:#1B2A4A; letter-spacing:0.2px; margin:22px 0 12px; padding-top:18px; border-top:2px solid var(--gov-blue); }
  .detail-empty{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--ink-faint); }
  .detail-empty-mark{ font-size:34px; color:var(--line-strong); font-weight:700; }
  .detail-empty p{ font-size:13px; margin:0; }

  .btn{ font-family:'Pretendard', sans-serif; font-weight:700; border:none; cursor:pointer; border-radius:3px; padding:9px 15px; font-size:12.5px; }
  .btn:focus-visible{ outline:2px solid var(--gov-blue); outline-offset:2px; }
  .btn-primary{ background:var(--gov-blue); color:#fff; }
  .btn-primary:hover{ background:var(--gov-blue-dark); }
  .btn-ghost{ background:none; color:var(--ink-soft); border:1px solid var(--line-strong); }
  .btn-ghost:hover{ color:var(--ink); border-color:var(--ink-soft); }
  .btn-danger{ background:var(--gov-red); color:#fff; }
  .btn-danger:hover{ background:#9C2E2E; }
  .btn-small{ padding:6px 10px; font-size:11px; }
  .btn:disabled{ background:#E9ECF1 !important; color:var(--ink-faint) !important; border-color:var(--line) !important; cursor:default; }

  /* ---------- 채팅 말풍선 ---------- */
  #detailPanel > .chat-scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:18px 24px; min-height:0; }
  .bubble-row{ display:flex; gap:8px; margin-bottom:14px; align-items:flex-end; }
  .bubble-row.mine{ flex-direction:row-reverse; }
  .bubble-col{ display:flex; flex-direction:column; max-width:70%; }
  .bubble-row.mine .bubble-col{ align-items:flex-end; }
  .bubble-name{ font-size:11px; font-weight:700; color:var(--gov-blue); margin:0 0 3px 3px; }
  .bubble{ background:#fff; border:1px solid var(--line-strong); border-radius:4px 4px 4px 0; padding:9px 13px; font-size:13.5px; line-height:1.5; color:var(--ink); word-break:break-word; }
  .bubble-row.mine .bubble{ background:var(--gov-blue); color:#fff; border-color:var(--gov-blue); border-radius:4px 4px 0 4px; }
  .bubble-time{ font-size:9px; color:var(--ink-faint); font-family:'IBM Plex Mono', monospace; margin:3px 3px 0; }
  .msg-delete-btn{ background:none; border:none; color:var(--ink-faint); font-size:9px; font-family:'IBM Plex Mono', monospace; cursor:pointer; padding:0; margin-left:6px; text-decoration:underline; }
  .msg-delete-btn:hover{ color:var(--gov-red); }

  /* ---------- 공고 댓글: 로그 행 + 답글 ---------- */
  .msg-row{ display:flex; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line-soft); }
  .msg-row:last-child{ border-bottom:none; }
  .msg-avatar{
    width:28px; height:28px; border-radius:50%; background:var(--gov-blue); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; flex-shrink:0; font-family:'IBM Plex Mono', monospace;
    background-size:cover; background-position:center;
  }
  .msg-body{ flex:1; min-width:0; }
  .msg-head{ display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .msg-name{ font-weight:700; font-size:12.5px; color:#1B2A4A; }
  .msg-time{ font-size:10px; color:var(--ink-faint); font-family:'IBM Plex Mono', monospace; }
  .msg-text{ font-size:13px; color:var(--ink); margin-top:2px; line-height:1.55; word-break:break-word; max-width:640px; }
  .reply-to-tag{ font-size:10.5px; color:var(--gov-blue); font-weight:600; margin:1px 0 2px; }
  .reply-link{ background:none; border:none; color:var(--ink-faint); font-size:10.5px; font-family:'IBM Plex Mono', monospace; cursor:pointer; padding:4px 0 0; }
  .reply-link:hover{ color:var(--gov-blue); text-decoration:underline; }
  .replying-banner{ display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--gov-blue-tint); border:1px solid #D7E2F3; border-radius:3px; padding:6px 10px; margin:0 24px 8px; font-size:11.5px; color:var(--gov-blue-dark); }
  .replying-banner button{ background:none; border:none; color:var(--gov-blue-dark); font-size:14px; cursor:pointer; font-weight:700; line-height:1; }

  .chat-compose{ display:flex; gap:8px; padding:16px 24px; border-top:1px solid var(--line); background:#F9FAFC; flex-shrink:0; }
  .chat-compose input{ flex:1; min-width:0; border:1px solid var(--line-strong); background:#fff; border-radius:3px; padding:9px 12px; font-size:13px; font-family:'Pretendard', sans-serif; }
  .chat-compose input:focus-visible{ outline:2px solid var(--gov-blue); }
  .empty{ text-align:center; padding:28px 12px; color:var(--ink-faint); font-size:12.5px; font-family:'IBM Plex Mono', monospace; }

  .stamp{
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:10px; letter-spacing:1px;
    border:2px solid var(--green); color:var(--green); border-radius:3px; padding:5px 9px;
    white-space:nowrap; flex-shrink:0; background:var(--green-tint);
  }
  .stamp.closed{ border-color:var(--gov-red); color:var(--gov-red); background:var(--gov-red-tint); }

  /* ---------- Modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(20,30,50,0.5); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .overlay[hidden]{ display:none; }
  .modal{ background:#fff; border-radius:4px; border:1px solid var(--line-strong); width:100%; max-width:440px; max-height:88vh; overflow-y:auto; padding:30px 34px 24px; box-shadow:0 20px 50px rgba(20,30,50,0.28); }
  .modal h3{ text-align:center; font-family:'Pretendard', sans-serif; font-size:17px; font-weight:800; margin:0 0 6px; color:#1B2A4A; }
  .modal p.hint{ text-align:center; margin:0 0 16px; font-size:12px; color:var(--ink-soft); line-height:1.5; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11.5px; color:var(--gov-blue); margin-bottom:4px; font-weight:700; font-family:'Pretendard', sans-serif; letter-spacing:0; }
  .field input, .field textarea{ width:100%; font-family:'Pretendard', sans-serif; background:#F9FAFC; border:1px solid var(--line-strong); border-radius:3px; padding:9px 11px; font-size:13.5px; color:var(--ink); }
  .field textarea{ resize:vertical; min-height:60px; }
  .field input:focus-visible, .field textarea:focus-visible{ outline:2px solid var(--gov-blue); outline-offset:1px; }
  .error-msg{ color:var(--gov-red); font-size:12px; margin:-4px 0 10px; min-height:14px; font-weight:600; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }

  .photo-picker{ display:flex; align-items:center; gap:12px; }
  .photo-preview{
    width:56px; height:56px; border-radius:50%; background:var(--gov-blue); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; font-family:'IBM Plex Mono', monospace;
    flex-shrink:0; border:2px solid var(--line-strong); background-size:cover; background-position:center;
  }
  .photo-picker-actions{ display:flex; gap:6px; flex-wrap:wrap; }

  .toast-stack{ position:fixed; top:16px; right:16px; z-index:70; display:flex; flex-direction:column; gap:8px; max-width:320px; width:calc(100% - 32px); }
  .toast-notif{
    background:#fff; color:var(--ink); border:1px solid var(--line-strong); border-left:3px solid var(--gov-blue); border-radius:4px;
    padding:11px 14px; font-size:12.5px; line-height:1.5; box-shadow:0 8px 24px rgba(20,30,50,0.18);
    cursor:pointer; animation:toastIn 0.25s ease;
  }
  .toast-notif strong{ color:var(--gov-blue); }
  .toast-notif em{ font-style:normal; color:var(--ink-soft); }
  .toast-sub{ display:block; color:var(--ink-soft); font-size:11.5px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(-8px);} to{ opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .toast-notif{ animation:none; } }

  /* ---------- 매뉴얼 게시판 (관공서 스타일, 전체화면 오버레이) ---------- */
  .manual-overlay{ position:fixed; inset:0; z-index:40; background:#fff; }
  .manual-overlay[hidden]{ display:none; }
  .manual-page{ background:#fff; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; color:#22262E; }
  .manual-exit{
    position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:4px; width:100%;
    background:#fff; border:none; border-bottom:1px solid #E4E7EC;
    padding:12px 20px; font-size:12px; font-weight:700; color:#8A93A3; cursor:pointer; text-align:left;
    font-family:'Pretendard',sans-serif;
  }
  .manual-exit:hover{ color:#1B4A9C; }
  .manual-hero{ text-align:center; padding:34px 20px 20px; border-bottom:3px solid #1B4A9C; background:linear-gradient(180deg,#F6F8FB,#fff); }
  .manual-taegeuk{ width:50px; height:50px; margin:0 auto 8px; display:block; }
  .manual-title{ font-family:'Pretendard', sans-serif; font-weight:800; font-size:30px; margin:0; color:#1B2A4A; letter-spacing:0.2px; line-height:1.2; }
  .manual-subtitle{ margin:8px 0 0; font-size:11.5px; color:#7A8290; letter-spacing:2.5px; font-family:'IBM Plex Mono', monospace; }
  .manual-toolbar{ display:flex; gap:10px; align-items:center; padding:16px 24px; border-bottom:1px solid #E4E7EC; flex-wrap:wrap; }
  .manual-search{ flex:1; min-width:220px; display:flex; border:1px solid #C7CDD6; border-radius:4px; overflow:hidden; }
  .manual-search input{ flex:1; min-width:0; border:none; padding:9px 12px; font-size:13px; font-family:'Pretendard',sans-serif; color:#22262E; }
  .manual-search input:focus-visible{ outline:none; }
  .manual-search button{ background:#1B4A9C; color:#fff; border:none; padding:0 16px; font-weight:700; font-size:12.5px; cursor:pointer; font-family:'Pretendard',sans-serif; }
  .manual-search button:hover{ background:#153B7C; }
  .manual-meta{ padding:12px 24px 0; font-size:11.5px; color:#7A8290; font-family:'IBM Plex Mono', monospace; }
  .manual-new-btn{ background:#1B4A9C; color:#fff; }
  .manual-new-btn:hover{ background:#153B7C; }
  .manual-table{ width:100%; border-collapse:collapse; margin-top:6px; }
  .manual-table thead th{ text-align:left; font-size:11px; color:#7A8290; font-weight:700; padding:10px 24px; border-bottom:2px solid #1B4A9C; background:#F6F8FB; white-space:nowrap; }
  .manual-row td{ padding:14px 24px; border-bottom:1px solid #EEF0F3; cursor:pointer; vertical-align:top; }
  .manual-row:hover td{ background:#F5F8FC; }
  .manual-regno{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:#1B4A9C; font-weight:700; white-space:nowrap; }
  .manual-row-title{ font-weight:700; font-size:14px; color:#1B2A4A; margin:0; }
  .manual-row-date{ font-size:11.5px; color:#9AA3B0; font-family:'IBM Plex Mono', monospace; text-align:right; white-space:nowrap; }
  .manual-detail{ padding:30px 28px 48px; max-width:760px; margin:0 auto; }
  .manual-back{ background:none; border:none; color:#1B4A9C; font-weight:700; font-size:12.5px; cursor:pointer; padding:0; margin-bottom:20px; font-family:'Pretendard',sans-serif; }
  .manual-back:hover{ text-decoration:underline; }
  .manual-detail-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; border-bottom:2px solid #1B4A9C; padding-bottom:12px; margin-bottom:14px; }
  .manual-detail-title{ font-size:21px; font-weight:800; color:#1B2A4A; margin:0; }
  .manual-detail-meta{ font-size:12px; color:#7A8290; margin:0 0 22px; font-family:'IBM Plex Mono', monospace; }
  .manual-detail-content{ font-size:14px; line-height:1.8; color:#28303D; white-space:pre-wrap; word-break:break-word; }
  .manual-detail-content img{ max-width:100%; border-radius:4px; margin:12px 0; display:inline-block; }
  .manual-detail-actions{ margin-top:26px; padding-top:16px; border-top:1px solid #EEF0F3; }

function resizeImageToDataURL(file, size){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read-failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode-failed'));
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const minSide = Math.min(img.width, img.height);
        const sx = (img.width - minSide) / 2, sy = (img.height - minSide) / 2;
        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function resizeImageToDataURLFit(file, maxWidth){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read-failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode-failed'));
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function wrapManualEditorBlocks(editor){
  Array.from(editor.childNodes).forEach((node) => {
    if(node.nodeType === 3 && !node.textContent.trim()) return;
    if(node.nodeType === 1 && (node.tagName === 'DIV' || node.tagName === 'P')) return;
    const div = document.createElement('div');
    editor.insertBefore(div, node);
    div.appendChild(node);
  });
}
function currentManualRange(editor){

  }

}

  Array.from(editor.children).forEach((block) => {

  });
}
function insertManualImageBlock(editor, dataURL){
  const wrap = document.createElement('div');
  wrap.style.textAlign = 'center';
  const img = document.createElement('img');
  img.src = dataURL;

  let range = currentManualRange(editor);
  if(!range){
    range = document.createRange();
    range.selectNodeContents(editor);
    range.collapse(false);
  }
  range.deleteContents();
  range.insertNode(wrap);

  after.setStartAfter(wrap);
  after.collapse(true);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(after);
}
const MANUAL_ALLOWED_TAGS = new Set(['B','STRONG','I','EM','U','BR','DIV','P','IMG','SPAN','FONT']);
function sanitizeManualStyle(styleStr){
  if(!styleStr) return '';
  const out = [];
  styleStr.split(';').forEach((decl) => {
    const m = decl.match(/^\s*(text-align|color)\s*:\s*([^;]+?)\s*$/i);
    if(!m) return;
    const prop = m[1].toLowerCase();
    const val = m[2].trim();
    if(/url\(|expression|javascript:/i.test(val)) return;
    if(prop === 'text-align' && !/^(left|right|center|justify)$/i.test(val)) return;
    if(prop === 'color' && !/^(#[0-9a-f]{3,8}|rgba?\([\d.,\s%]+\)|[a-z]+)$/i.test(val)) return;
    out.push(`${prop}: ${val}`);
  });
  return out.join('; ');
}
function sanitizeManualHtml(html){
  const wrap = document.createElement('div');
  wrap.innerHTML = html || '';
  const walk = (node) => {
    Array.from(node.childNodes).forEach((child) => {
      if(child.nodeType === 1){
        if(!MANUAL_ALLOWED_TAGS.has(child.tagName)){
          while(child.firstChild) node.insertBefore(child.firstChild, child);
          node.removeChild(child);
          return;
        }
        Array.from(child.attributes).forEach((attr) => {
          if(child.tagName === 'IMG' && attr.name === 'src' && /^data:image\//i.test(attr.value)) return;
          if(attr.name === 'style'){
            const cleaned = sanitizeManualStyle(attr.value);
            if(cleaned) child.setAttribute('style', cleaned); else child.removeAttribute('style');
            return;
          }
          if(child.tagName === 'FONT' && attr.name === 'color' && /^#?[0-9a-f]{3,8}$/i.test(attr.value)) return;
          child.removeAttribute(attr.name);
        });
        walk(child);
      }else if(child.nodeType !== 3){
        node.removeChild(child);
      }
    });
  };
  walk(wrap);

function showToast(html, osTitle, osBody, onClick){
  if(!notifEnabled) return;
  const stack = el('toastStack');
  const toast = document.createElement('div');
  toast.className = 'toast-notif';
  toast.innerHTML = html;
  toast.addEventListener('click', () => { if(onClick) onClick(); toast.remove(); });
  stack.appendChild(toast);
  setTimeout(() => toast.remove(), 6000);
  if(notifPermission === 'granted' && document.visibilityState === 'hidden'){
    try{
      const n = new Notification(osTitle, { body: osBody });
      n.onclick = () => { window.focus(); if(onClick) onClick(); };
    }catch(e){}
  }
}

function renderChatBubbles(messages){
  const wrap = document.getElementById('chatScroll');
  if(!wrap) return;
  if(messages.length === 0){
    wrap.innerHTML = `<div class="empty">등록된 메시지가 없습니다.</div>`;
    lastRenderedMsgIds = [];
    return;
  }
  const newIds = messages.map(m => m.id);
  const isAppendOnly = lastRenderedMsgIds.length > 0
    && newIds.length >= lastRenderedMsgIds.length
    && lastRenderedMsgIds.every((id, i) => newIds[i] === id);
  const appended = isAppendOnly ? messages.slice(lastRenderedMsgIds.length) : messages;
  const distanceFromBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight;
  const wasNearBottom = distanceFromBottom < 120;
  const appendedIsMine = appended.some(m => m.authorId === myAgentId);

  if(isAppendOnly){
    if(appended.length > 0) wrap.insertAdjacentHTML('beforeend', appended.map(bubbleHtml).join(''));
  }else{
    wrap.innerHTML = messages.map(bubbleHtml).join('');
  }
  lastRenderedMsgIds = newIds;

  if(!isAppendOnly || wasNearBottom || appendedIsMine){
    requestAnimationFrame(() => { wrap.scrollTop = wrap.scrollHeight; });
  }
  bindMsgDeleteButtons(wrap);
}
function subscribeChannelMessages(channelId){
  if(unsubscribeChannelMessages){ unsubscribeChannelMessages(); unsubscribeChannelMessages = null; }
  currentChannelMessages = [];
  unsubscribeChannelMessages = onSnapshot(
    query(messagesCol, where('channelId', '==', channelId), orderBy('sentAt', 'desc'), limit(CHANNEL_MESSAGE_LIMIT)),
    (snap) => {
      const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      docs.sort((a, b) => toJsDate(a.sentAt).getTime() - toJsDate(b.sentAt).getTime());
      currentChannelMessages = docs;
      if(selectedChannelId === channelId) renderChatBubbles(currentChannelMessages);
    },
    (err) => {
      console.error(err);
      const wrap = document.getElementById('chatScroll');
      if(!wrap || selectedChannelId !== channelId) return;
      const link = /https:\/\/console\.firebase\.google\.com\S+/.exec((err && err.message) || '');
      wrap.innerHTML = link
        ? `<div class="empty">⚠️ Firestore 색인이 아직 없어요.<br><a href="${link[0]}" target="_blank" rel="noopener" style="color:var(--gov-blue); word-break:break-all;">여기를 눌러 색인 만들기</a><br>(만든 뒤 1~2분 후 새로고침 해주세요)</div>`
        : `<div class="empty">⚠️ 채널을 불러오지 못했습니다.</div>`;
    }
  );
}

  imageBtn.addEventListener('mousedown', (e) => e.preventDefault());
  imageBtn.addEventListener('click', () => el('mImageInput').click());
  el('mImageInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    try{
      const dataURL = await resizeImageToDataURLFit(file, 640);
      const editor = el('mContentEditor');
      editor.focus();
      insertManualImageBlock(editor, dataURL);
    }catch(err){ el('mError').textContent = '이미지를 불러오지 못했습니다. 다른 파일을 선택해주세요.'; }
  });
  el('mSubmit').addEventListener('click', async () => {
    const regNo = el('mRegNoInput').value.trim();
    const disasterName = el('mDisasterInput').value.trim();
    const editor = el('mContentEditor');
    const content = sanitizeManualHtml(editor.innerHTML);
    const hasText = editor.textContent.trim().length > 0;
    const hasImage = /<img\b/i.test(content);
    if(!regNo || !disasterName || (!hasText && !hasImage)){ el('mError').textContent = '등록번호, 재난 이름, 매뉴얼 내용을 모두 입력해주세요.'; return; }
    try{
      if(isEdit){
        await updateDoc(doc(manualsCol, existing.id), { regNo, disasterName, content, updatedAt: new Date().toISOString() });
      }else{
        await addDoc(manualsCol, { regNo, disasterName, content, authorId: myAgentId, authorName: myProfile.name, createdAt: new Date().toISOString() });
      }
      closeModal();
    }catch(e){ el('mError').textContent = (isEdit ? '수정' : '등록') + ' 중 문제가 생겼습니다. 다시 시도해주세요.'; }
  });
  el('mCancel').addEventListener('click', closeModal);
}

function boot(){
  updateAgentBar();
  setMode('chat');
  if(!isConfigured){
    const body = el('listPanel').querySelector('.list-body');
    if(body) body.innerHTML = `<div class="empty">⚙️ Firebase 설정이 안 됐어요.</div>`;
    return;
  }
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  messagesCol = collection(db, 'messages');
  recruitsCol = collection(db, 'recruits');
  agentsCol = collection(db, 'agents');
  manualsCol = collection(db, 'manuals');
  roomAccessCol = collection(db, 'roomAccess');

  getDocs(agentsCol).then((snap) => {
    const map = {};
    snap.docs.forEach(d => { map[d.id] = d.data(); });
    agentProfiles = map;
    renderListPanel();
    renderDetailPanel();
  }).catch((err) => console.error(err));

  subscribeChannelMessages(selectedChannelId);

  CHANNELS.forEach((ch) => {
    onSnapshot(query(messagesCol, where('channelId', '==', ch.id), orderBy('sentAt', 'desc'), limit(1)), (snap) => {
      const docSnap = snap.docs[0];
      channelPreviews[ch.id] = docSnap ? { id: docSnap.id, ...docSnap.data() } : null;
      if(currentMode === 'chat') renderChannelRows();
      snap.docChanges().forEach((change) => {
        if(change.type !== 'added') return;
        if(isRoomLocked(ch)) return;
        const m = change.doc.data();
        if(!m.sentAt || toJsDate(m.sentAt).toISOString() <= notifBootTime) return;
        if(m.authorId === myAgentId) return;
        const viewingThisChannel = currentMode === 'chat' && selectedChannelId === ch.id && document.visibilityState === 'visible';
        if(viewingThisChannel) return;
        notifyChannelMessage(m, ch.id);
      });
    }, (err) => console.error(err));
  });

  onSnapshot(query(recruitsCol, orderBy('createdAt', 'desc'), limit(100)), (snap) => {
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    docs.forEach((r, i) => { const seq = docs.length - i; r.caseNo = `CASE-${new Date(r.createdAt).getFullYear()}-${pad4(seq)}`; });
    lastRecruits = docs;
    if(currentMode === 'recruit') renderRecruitRows();
    if(selectedRecruitId) renderDetailPanel();
  }, (err) => { console.error(err); const body = document.getElementById('recruitListBody'); if(body) body.innerHTML = `<div class="empty">⚠️ 공고를 불러오지 못했습니다.</div>`; });

  onSnapshot(query(manualsCol, orderBy('createdAt', 'desc'), limit(300)), (snap) => {
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    docs.forEach((m) => { if(!m.regNo) m.regNo = '—'; });
    lastManuals = docs;
    if(currentMode === 'manual') renderManualPage();
  }, (err) => console.error(err));

  onSnapshot(query(collectionGroup(db, 'replies'), orderBy('sentAt', 'desc'), limit(50)), (snap) => {
    snap.docChanges().forEach((change) => {
      if(change.type !== 'added') return;
      const rep = change.doc.data();
      if(!rep.sentAt || rep.sentAt <= notifBootTime) return;
      if(rep.authorId === myAgentId) return;
      const recruitId = change.doc.ref.parent.parent.id;
      const r = lastRecruits.find(x => x.id === recruitId);
      const isReplyToMe = rep.replyToAuthorId === myAgentId;
      const isOwnPost = !!r && r.authorId === myAgentId;
      if(!r || (!isOwnPost && !isReplyToMe)) return;
      notifyRecruitComment(r, rep, recruitId, isReplyToMe && !isOwnPost);
    });
  }, (err) => console.error(err));
}
boot();
</script>
</body>
</html>
